name: Build FoodFusion AI Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: foodfusion_ai/mobile
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: foodfusion_ai/mobile
        run: flutter test

      - name: Build Release APK
        working-directory: foodfusion_ai/mobile
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodFusion-AI-release-apk
          path: foodfusion_ai/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
